<title>Tracks</title>

<style>
  /* ✏️ The loading screen's colours on someone's very first visit (after that it uses your order link's own theme) */

  #title { font-weight: 800; font-size: 22px; margin-bottom: 4px; letter-spacing: .01em; }
  #title:empty { display: none; }
  #msg { color: var(--muted); min-height: 1.5em; transition: opacity .35s; }
