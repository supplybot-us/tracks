<html lang="en">
<head>

<title>Brainwave Tracks</title>

<style>
  /* ✏️ The loading screen's colours on someone's very first visit (after that it uses your order link's own theme) */
  :root { --bg: #0b0820; --text: #ece8ff; --muted: #a49fd0; --brand: #a78bfa; --soft: #2b2160; --spark: #f0abfc; --font: -apple-system, "Segoe UI", Roboto, sans-serif; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; overflow: hidden; z-index: 2; transition: opacity .5s, transform .5s;
    background: radial-gradient(ellipse at 50% 55%, color-mix(in srgb, var(--soft) 80%, var(--bg)) 0%, var(--bg) 62%); }
  #wait.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
  #wait > div { position: relative; z-index: 1; }
  /* 🌌 drifting nebula and twinkling stars */
  .neb { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: .32; animation: drift 18s ease-in-out infinite alternate; }
  .neb.a { background: var(--brand); left: -20vmax; top: -22vmax; }
  .neb.b { background: var(--spark); right: -24vmax; bottom: -26vmax; animation-duration: 23s; opacity: .22; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .2; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .95; transform: scale(1.6); } }
  /* 🎶 the centre: sound-wave rings, orbiting planets, and the logo or Supplybot in headphones */
  .co { display: block; height: 52px; max-width: min(280px, 80vw); margin: 0 auto 18px; object-fit: contain; animation: coIn .7s ease-out both; }
  .co[hidden] { display: none; }
  @keyframes coIn { from { opacity: 0; transform: translateY(-10px); } }
  .stage { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 14px; }
  .core { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
  .wave { position: absolute; inset: 30px; border-radius: 50%; border: 2px solid var(--brand); opacity: 0; animation: wave 2.4s cubic-bezier(.2, .6, .3, 1) infinite; }
  .wave:nth-child(2) { animation-delay: .8s; } .wave:nth-child(3) { animation-delay: 1.6s; }
  @keyframes wave { 0% { transform: scale(.55); opacity: .85; } 100% { transform: scale(1.5); opacity: 0; } }
  .orbit { position: absolute; inset: 4px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--brand) 35%, transparent); animation: spinr 9s linear infinite; }
  .orbit.b { inset: 24px; animation-duration: 6s; animation-direction: reverse; border-color: color-mix(in srgb, var(--spark) 25%, transparent); }
  .orbit i { position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--spark); box-shadow: 0 0 14px var(--spark); }
  .orbit.b i { width: 8px; height: 8px; margin-left: -4px; top: -4px; background: var(--brand); box-shadow: 0 0 12px var(--brand); }
  @keyframes spinr { to { transform: rotate(360deg); } }
  .core #lgo, .core .dbot { position: relative; width: 104px; height: 104px; object-fit: contain; animation: beat 1.1s ease-in-out infinite; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--brand) 60%, transparent)); }
  .core #lgo[hidden] { display: none; } .core #lgo:not([hidden]) ~ .dbot { display: none; }
  @keyframes beat { 0%, 100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.08) rotate(3deg); } }
  .dbot .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .dbot .note { animation: note 2.2s ease-out infinite; opacity: 0; } .dbot .note.n2 { animation-delay: 1.1s; }
  @keyframes note { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -30px) rotate(20deg); } }
  .bot { width: 96px; height: 106px; object-fit: contain; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--brand) 50%, transparent)); transform-origin: 50% 95%; animation: hop 1.1s cubic-bezier(.3, 0, .4, 1) infinite; }
  .bot[hidden] { display: none; }
  @keyframes hop { 0%, 100% { transform: translateY(0) rotate(-4deg) scale(1, .96); } 45% { transform: translateY(-14px) rotate(4deg) scale(.98, 1.03); } }
  /* 🤖 your own Supplybot, built into this page: he dances in the middle of the sound waves, in a spotlight, with notes floating up */
  .core.has-ohm { width: 250px; height: 250px; }
  .core.has-ohm #lgo, .core.has-ohm .dbot { display: none !important; }
  .ohm { position: relative; z-index: 1; height: 196px; width: auto; max-width: 180px; object-fit: contain; transform-origin: 50% 92%; animation: ohmDance 2.2s cubic-bezier(.3, 0, .4, 1) infinite;
    filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .45)) drop-shadow(0 0 22px color-mix(in srgb, var(--brand) 55%, transparent)); }
  .ohm[hidden], .spot[hidden] { display: none; }
  @keyframes ohmDance { 0%, 50%, 100% { transform: translateY(0) rotate(-5deg) scale(1.02, .96); } 25% { transform: translateY(-14px) rotate(1deg) scale(.98, 1.03); } 37% { transform: translateY(-4px) rotate(4deg); }
    75% { transform: translateY(-14px) rotate(-1deg) scale(.98, 1.03); } 87% { transform: translateY(-4px) rotate(-4deg); } }
  .core.has-ohm .ohm { animation-name: ohmDance; } .core.has-ohm:hover .ohm { animation-duration: 1.1s; }
  .spot { position: absolute; left: 50%; bottom: 14px; width: 170px; height: 28px; margin-left: -85px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--brand) 75%, transparent), transparent); animation: spot .55s ease-in-out infinite alternate; }
  @keyframes spot { to { transform: scale(.72); opacity: .55; } }
  .fnote { position: absolute; z-index: 2; font-size: 22px; font-weight: 700; color: var(--spark); opacity: 0; text-shadow: 0 0 10px var(--spark); animation: fnote 2.6s ease-out infinite; pointer-events: none; }
  .fnote.b { color: var(--brand); text-shadow: 0 0 10px var(--brand); }
  @keyframes fnote { 0% { opacity: 0; transform: translate(0, 12px) scale(.6) rotate(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 20px), -96px) scale(1.25) rotate(var(--r, 20deg)); } }
  /* 📊 the equalizer */
  .eq { display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 34px; margin: 2px auto 14px; }
  .eq i { width: 6px; height: 100%; border-radius: 3px; background: linear-gradient(to top, var(--brand), var(--spark)); transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
  @keyframes eq { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
  #title { font-weight: 800; font-size: 22px; margin-bottom: 4px; letter-spacing: .01em; }
  #title:empty { display: none; }
  #msg { color: var(--muted); min-height: 1.5em; transition: opacity .35s; }
  #msg.fade { opacity: 0; }
  #help { display: none; max-width: 340px; margin: 0 auto; }
  #help.on { display: block; }
  #help a { display: inline-block; margin-top: 12px; padding: 14px 26px; border-radius: 14px; background: var(--brand); color: var(--bg); font-weight: 800; text-decoration: none; }
  #why { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }
  #why:empty { display: none; }
  #wait #why { max-width: 360px; margin: 10px auto 0; opacity: .85; }
  #msg.tapme { font-weight: 800; color: var(--text); animation: tapme 1.4s ease-in-out infinite; } @keyframes tapme { 50% { transform: scale(1.06); } }
  #shop { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  @media (prefers-reduced-motion: reduce) { #wait *, #wait *::before { animation: none !important; } .wave { opacity: .3; } }
</style>
