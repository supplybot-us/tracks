<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>Tracks</title>
<style>
  /* ✏️ The loading screen's colours on someone's very first visit (after that it uses your order link's own theme) */
  :root { --bg: #0b0820; --text: #ece8ff; --muted: #a49fd0; --brand: #a78bfa; --soft: #2b2160; --font: -apple-system, "Segoe UI", Roboto, sans-serif; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--bg); z-index: 2; transition: opacity .35s; }
  #wait.gone { opacity: 0; pointer-events: none; }
  .ld { position: relative; width: 132px; height: 132px; margin: 0 auto 18px; display: grid; place-items: center; }
  .ld .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--brand) 22%, transparent); border-top-color: var(--brand); animation: s 1.1s linear infinite; }
  .ld img { width: 92px; height: 92px; object-fit: contain; animation: pulse 1.8s ease-in-out infinite; }
  .ld img[hidden] { display: none; }
  .ld.nologo { width: 52px; height: 52px; }
  .co { display: block; height: 52px; max-width: min(280px, 80vw); margin: 0 auto 22px; object-fit: contain; animation: coIn .6s ease-out both; }
  .co[hidden] { display: none; }
  @keyframes coIn { from { opacity: 0; transform: translateY(-8px); } }
  .stage { display: flex; align-items: flex-end; justify-content: center; gap: 6px; margin: 0 auto 18px; }
  .stage .ld { margin: 0; }
  .bot { width: 92px; height: 100px; object-fit: contain; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--brand) 50%, transparent)); transform-origin: 50% 95%; animation: hop 1.1s cubic-bezier(.3, 0, .4, 1) infinite; }
  .bot[hidden] { display: none; }
  @keyframes hop { 0%, 100% { transform: translateY(0) rotate(-4deg) scale(1, .96); } 45% { transform: translateY(-14px) rotate(4deg) scale(.98, 1.03); } }
  @keyframes s { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.07); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--brand) 55%, transparent)); } }
  @media (prefers-reduced-motion: reduce) { .ld .ring, .ld img, .bot { animation: none; } }
  #title { font-weight: 800; font-size: 20px; margin-bottom: 4px; }
  #title:empty { display: none; }
  #msg { color: var(--muted); }
  #help { display: none; max-width: 340px; margin: 0 auto; }
  #help.on { display: block; }
  #help a { display: inline-block; margin-top: 12px; padding: 14px 26px; border-radius: 14px; background: var(--brand); color: var(--bg); font-weight: 800; text-decoration: none; }
  #shop { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
</style>
</head>
<body>
<div id="wait">
  <div>
    <img class="co" id="co" alt="" hidden>
    <div class="stage"><div class="ld nologo" id="ld"><div class="ring" id="spin"></div><img id="lgo" alt="" hidden></div><img class="bot" id="bot" alt="" hidden></div>
    <div id="title"></div>
    <div id="msg">Loading…</div>
    <div id="help"><div id="helpt">This is taking longer than usual.</div><a id="open" target="_top" rel="noopener">Open the page</a></div>
  </div>
</div>
<iframe id="shop" title="Shop" allow="autoplay; clipboard-write; fullscreen; web-share"></iframe>
<script>
  /* ✏️ Your public shop deployment's Web app URL (ends in /exec), and the order link this page shows when no other is asked for */
  var EXEC = 'https://script.google.com/macros/s/AKfycbzFLg7NCPjqFCgSL6aPql9b7_kb1WPTYURDw-nG_qtx05A1WdcTEdaU38XC64OvXJLC/exec?shop=0bf5d70823434753a1c07315b5b4265f';
  var SHOP = '0bf5d70823434753a1c07315b5b4265f';

  /* ?shop=…&o=… on this page picks the order link (and one order); otherwise SHOP is shown */
  var q = new URLSearchParams(location.search); if (!q.get('shop')) q.set('shop', SHOP); q.delete('via'); q.delete('api');
  var google_url = EXEC + '?' + q.toString();
  document.getElementById('open').href = google_url;

  /* 🏷 The loading screen wears the order link's theme: remembered from the last visit (instant), and asked for straight away */
  var LOOK_KEY = 'sbLook:' + q.get('shop');
  function look(L) { if (!L || !L.bg) return; var r = document.documentElement.style;
    ['bg', 'text', 'muted', 'brand', 'soft'].forEach(function (k) { if (/^#[0-9a-f]{3,8}$/i.test(L[k] || '')) r.setProperty('--' + k, L[k]); });
    if (L.font && /^[A-Za-z0-9 ]{1,40}$/.test(L.font)) { if (!document.getElementById('lkfont')) { var ln = document.createElement('link'); ln.id = 'lkfont'; ln.rel = 'stylesheet';
        ln.href = 'https:' + '\x2F\x2F' + 'fonts.googleapis.com/css2?family=' + encodeURIComponent(L.font).replace(/%20/g, '+') + (L.axis || ':wght@400;600;800') + '&display=swap'; document.head.appendChild(ln); }
      r.setProperty('--font', '"' + L.font + '", -apple-system, "Segoe UI", Roboto, sans-serif'); }
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = L.bg;
    if (L.title) { document.getElementById('title').textContent = L.title; document.title = L.title; }
    var im = document.getElementById('lgo'); if (L.logo && /^data:image\/(png|jpeg|webp);base64,/.test(L.logo)) { im.src = L.logo; im.hidden = false; document.getElementById('ld').classList.remove('nologo'); }
    var co = document.getElementById('co'); if (L.company && /^data:image\/(png|jpeg|webp);base64,/.test(L.company)) { co.src = L.company; co.hidden = false; }
    var bt = document.getElementById('bot'); if (L.bot && /^<svg[\s>]/.test(L.bot)) { var sv = L.bot; if (!/^<svg[^>]*\sxmlns=/.test(sv)) sv = sv.replace(/^<svg/, '<svg xmlns="http:' + '\x2F\x2F' + 'www.w3.org/2000/svg"'); if (/xlink:/.test(sv) && !/xmlns:xlink=/.test(sv)) sv = sv.replace(/^<svg/, '<svg xmlns:xlink="http:' + '\x2F\x2F' + 'www.w3.org/1999/xlink"');
      bt.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sv); bt.hidden = false; } }
  try { look(JSON.parse(localStorage.getItem(LOOK_KEY) || 'null')); } catch (x) {}
  fetch(EXEC + '?' + q.toString() + '&api=look').then(function (r) { return r.json(); }).then(function (L) {
    if (done || !L || !L.bg) return; look(L); try { localStorage.setItem(LOOK_KEY, JSON.stringify(L)); } catch (x) {} }).catch(function () {});

  /* The order page's server calls go straight to your deployment (the same five calls it makes on Google's page) */
  var SHIM = '(' + function (EXEC) {
    function call(fn, args) {
      return fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function (r) { if (!r.ok) throw new Error('The shop is busy right now. Please try again.'); return r.json(); })
        .then(function (d) { if (!d || !d.ok) throw new Error((d && d.err) || 'Something went wrong. Please try again.'); return d.v; });
    }
    function runner(ok, no, u) {
      return new Proxy({}, { get: function (_, k) {
        if (k === 'withSuccessHandler') return function (h) { return runner(h, no, u); };
        if (k === 'withFailureHandler') return function (h) { return runner(ok, h, u); };
        if (k === 'withUserObject') return function (o) { return runner(ok, no, o); };
        return function () { var a = Array.prototype.slice.call(arguments);
          call(String(k), a).then(function (v) { if (ok) ok(v, u); }, function (e) { if (no) no(e, u); else console.error(e); }); };
      } });
    }
    window.google = { script: { run: runner(null, null), host: { close: function () {}, setHeight: function () {}, setWidth: function () {} } } };
    /* links to another order page stay on this website */
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null; if (!a) return;
      try { var u = new URL(a.href); if (u.hostname === 'script.google.com' && u.searchParams.get('shop')) { u.searchParams.delete('via'); e.preventDefault(); location.href = location.pathname + u.search; } } catch (x) {}
    }, true);
  } + ')(' + JSON.stringify(EXEC) + ');';

  var done = false;
  function framed() {   /* older server code: show Google's page inside this one, like before */
    if (done) return; done = true;
    var f = document.getElementById('shop'), w = document.getElementById('wait');
    window.addEventListener('message', function (e) { var h = ''; try { h = new URL(e.origin).hostname; } catch (x) { return; }
      if (/\.googleusercontent\.com$/.test(h) && e.data && e.data.supplybot === 'ready') w.classList.add('gone'); });
    f.style.display = 'block'; f.src = google_url;
  }
  function slow(t) { document.getElementById('spin').style.display = 'none'; document.getElementById('msg').style.display = 'none';
    if (t) document.getElementById('helpt').textContent = t; document.getElementById('help').classList.add('on'); }
  var timer = setTimeout(function () { slow(); }, 20000);

  fetch(EXEC + '?' + q.toString() + '&api=page')
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var d; try { d = JSON.parse(t); } catch (x) { return framed(); }   /* not data: the deployment still has the older code */
      if (!d || d.err || !d.html) { clearTimeout(timer); return slow(d && d.err); }
      done = true; clearTimeout(timer);
      var head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>' + SHIM + '<\/script>';
      var h = String(d.html);
      h = /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, function (m) { return m + head; }) : head + h;
      document.open(); document.write(h); document.close();
      if (d.title) document.title = d.title;
    })
    .catch(function () { framed(); });
</script>
</body>
</html>
